<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir POS - Minimarket Sejahtera</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pos.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/receipt.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Navbar -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo">MS</div>
        <div class="brand-text">
          <h1>Minimarket Sejahtera</h1>
          <span>Point of Sale v1.0</span>
        </div>
      </div>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link active">Kasir</a></li>
          <li>
            <a href="inventori.html" class="nav-link">
              Inventori
              <span class="badge-alert" id="header-low-stock-badge" style="display: none;">0</span>
            </a>
          </li>
          <li><a href="stok.html" class="nav-link">Kelola Stok</a></li>
          <li><a href="laporan.html" class="nav-link">Laporan</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="btn btn-sm btn-secondary" onclick="Auth.openStoreSettingsModal()" title="Pengaturan Toko & Struk">
          Pengaturan Struk
        </button>
      </div>
    </header>

    <!-- Main View POS (2 Columns) -->
    <main class="main-view pos-wrapper">
      <!-- LEFT COLUMN: Product Search & Catalog Grid -->
      <section class="pos-catalog-col">
        <div class="catalog-header">
          <!-- Barcode & Search Input -->
          <div class="search-input-box">
            <span class="search-icon">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" id="pos-barcode-input" class="barcode-input" placeholder="Scan Barcode atau ketik nama produk... (Tekan Enter)" autofocus autocomplete="off">
            <span class="barcode-hint-badge">
              <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M2 4h2v16H2V4zm3 0h1v16H5V4zm3 0h2v16H8V4zm4 0h1v16h-1V4zm3 0h2v16h-2V4zm4 0h1v16h-1V4zm2 0h2v16h-2V4z"/></svg>
              Scanner Siap
            </span>
          </div>
        </div>

        <!-- Product Grid -->
        <div class="catalog-grid-container">
          <div class="product-grid" id="pos-product-grid">
            <!-- Rendered by JS -->
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN: Cart Panel (Sticky/Slide-over on tablet) -->
      <section class="pos-cart-col" id="pos-cart-column">
        <!-- Cart Header -->
        <div class="cart-header">
          <div class="cart-title-info">
            <h3>Keranjang</h3>
            <span class="cart-items-count-badge" id="pos-cart-count">0 item</span>
          </div>
          <div class="cart-header-actions">
            <button class="btn btn-sm btn-secondary" onclick="POS.openHeldModal()" title="Daftar Transaksi Ditahan">
              Hold List <span class="badge badge-warning" id="pos-held-badge" style="display: none; margin-left: 4px;">0</span>
            </button>
            <button class="btn btn-sm btn-danger-outline" onclick="POS.voidCurrentCart()" title="Batalkan Keranjang">Void</button>
            <!-- Close button for tablet drawer -->
            <button class="modal-close-btn" id="tablet-close-cart-btn" style="display: none;">&times;</button>
          </div>
        </div>

        <!-- Cart Items Scroll List -->
        <div class="cart-items-list" id="pos-cart-items">
          <!-- Rendered by JS -->
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="pos-subtotal" style="font-weight: 600;">Rp 0</span>
          </div>

          <div class="summary-row clickable" onclick="POS.openTotalDiscountModal()">
            <span>Diskon Transaksi</span>
            <span id="pos-discount-total" style="color: var(--accent-primary); font-weight: 600;">-Rp 0</span>
          </div>

          <div class="summary-row">
            <div class="tax-toggle-wrapper">
              <label class="switch">
                <input type="checkbox" id="pos-tax-switch" checked>
                <span class="slider"></span>
              </label>
              <span id="pos-tax-rate-label">PPN (11%)</span>
            </div>
            <span id="pos-tax-amount" style="font-weight: 600;">Rp 0</span>
          </div>

          <div class="summary-grand-total">
            <span class="label">GRAND TOTAL</span>
            <span class="total-amount" id="pos-grand-total">Rp 0</span>
          </div>
        </div>

        <!-- Cart Action Buttons -->
        <div class="cart-actions">
          <button class="btn-pay-giant" onclick="POS.openPaymentModal()">
            <span>BAYAR</span>
            <span class="shortcut-kbd">F1</span>
          </button>

          <div class="cart-sub-actions">
            <button class="btn btn-secondary" onclick="POS.holdCurrentTransaction()">
              <span>Hold (Tahan)</span>
              <span class="shortcut-kbd">F2</span>
            </button>
            <button class="btn btn-danger-outline" onclick="POS.voidCurrentCart()">
              <span>Batal</span>
              <span class="shortcut-kbd">ESC</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Tablet Backdrop Overlay -->
      <div class="pos-cart-backdrop" id="pos-cart-backdrop"></div>
    </main>

    <!-- Tablet Bottom Dock Bar (Mobile/Portrait View) -->
    <div class="tablet-cart-bar">
      <div>
        <div style="font-size: 11px; color: var(--text-muted);" id="tablet-bar-count">0 item</div>
        <div style="font-size: 18px; font-weight: 800; color: var(--accent-primary);" id="tablet-bar-total">Rp 0</div>
      </div>
      <button class="btn btn-primary" id="tablet-open-cart-btn" style="min-height: 46px; padding: 0 20px;">
        Lihat Keranjang / Bayar
      </button>
    </div>
  </div>

  <!-- Modal Pembayaran -->
  <div class="modal-backdrop" id="payment-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pembayaran Transaksi</h3>
        <button class="modal-close-btn" onclick="POS.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="payment-modal-body">
        <!-- Rendered by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="POS.closeModal()">Batal (ESC)</button>
        <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="POS.processCheckout()">
          Konfirmasi Bayar & Cetak
        </button>
      </div>
    </div>
  </div>

  <!-- Generic Modal (Hold List, Discounts, Details) -->
  <div class="modal-backdrop" id="generic-modal" style="display: none;"></div>

  <!-- Hidden Thermal 58mm Print Area -->
  <div id="thermal-print-area"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
